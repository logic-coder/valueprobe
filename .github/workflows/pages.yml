name: pages

# One workflow for both verification and publishing. A push to main pays for a
# single npm ci + lightweight gates + build + deploy; the expensive browser
# drills run on pull requests only. A small pre-upload browser set still checks
# the built dist on push and manual deploy. Two independent workflows used to pay
# for the same install and the same lint/test/build twice on every push.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - name: Frozen historical kernel vectors
        run: npm run research:kernel
      - name: Frozen cash path artifact
        run: npm run research:cash-path -- --check
      - name: Frozen historical replays
        run: |
          python3 scripts/research/fetch-facts.py
          python3 scripts/research/fetch-facts.py tmp-historical-facts sectors-2015.json
          npm run research:check
      - name: Real-company regression on committed snapshots
        run: npm run test:real
      - name: Data gate (artifact, manifest, snapshots)
        run: npm run verify:data -- --check-lineage
        env:
          PUBLISH_HISTORY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

      # Browser suites are slow and need a Chromium download. They gate PRs,
      # not every data snapshot pushed to main.
      - name: Full browser gates (pull requests only)
        if: github.event_name == 'pull_request'
        run: |
          npx playwright install --with-deps --no-shell chromium
          npx playwright test
          npm run audit:contrast
          npm run rehearse:pages

      - name: Static-host smoke (pull requests)
        if: github.event_name == 'pull_request'
        run: npm run smoke:pages

      - name: Build for the project sub-path
        if: github.event_name != 'pull_request'
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          # The published site reads public/data only. Refresh those files locally
          # with npm run snapshot, then push. No browser gateway is baked in.
          VITE_TRANSPORT: direct

      - name: Static-host smoke on the built dist
        if: github.event_name != 'pull_request'
        run: npm run smoke:pages -- --built
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      # The dist above is the only artifact that gets uploaded, so check it
      # before the upload: sub-path boot, published value, search and axe. No
      # rebuild — the step serves dist/ through vite preview. A failure here
      # leaves the upload step skipped and the deploy job waiting.
      - name: Pre-upload browser gate on the built dist
        if: github.event_name != 'pull_request'
        run: |
          npx playwright install --with-deps --no-shell chromium
          npm run test:e2e:upload

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
